<!-- Header -->
<header class="w-full max-w-md mx-auto text-center py-4">
    <h1 class="text-3xl font-bold tracking-wider text-amber-400">🎲 ARZANOPOLY</h1>
    <p class="text-sm text-slate-400 mt-1">Gestione Bancaria & Lettore Contratti NFC</p>
</header>

<!-- Main Content Area -->
<main class="w-full max-w-md mx-auto flex-1 flex flex-col justify-center space-y-6 my-4">
    
    <!-- Status Panel -->
    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-xl backdrop-blur-md">
        <h2 class="text-lg font-semibold text-amber-300 mb-2 flex items-center gap-2">
            <span>📡</span> Stato Sistema NFC / POS
        </h2>
        <div id="nfc-status" class="text-sm text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 min-h-[60px] flex items-center">
            Pronto. Avvicina una carta contratto NFC per leggere i dati completi.
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-4">
        <button onclick="startNFCReader()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold py-4 px-6 rounded-2xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-3 text-lg">
            <span>📶</span> Leggi Carta NFC (JSON / Testo)
        </button>

        <button onclick="simulateDemoCard()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-6 rounded-2xl border border-slate-600 transition-all text-sm">
            🧪 Simula Lettura Carta (Demo JSON)
        </button>
    </div>

    <!-- Log attività -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-inner">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Registro Operazioni</h3>
        <div id="log-box" class="text-xs font-mono text-slate-400 space-y-1 max-h-32 overflow-y-auto">
            <div>[System] Applicazione avviata correttamente.</div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="w-full max-w-md mx-auto text-center text-xs text-slate-500 py-2">
    Arzanopoly PWA &bull; Web NFC & HCE Supported
</footer>

<!-- Modal Dettaglio Carta Contratto -->
<div id="qr-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full p-6 shadow-2xl relative animate-in fade-in zoom-in duration-200">
        <div class="flex justify-between items-start mb-4">
            <div>
                <span id="modal-card-badge" class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">Terreno</span>
                <h3 id="modal-card-title" class="text-2xl font-bold text-white mt-2">Nome Proprietà</h3>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 p-2 rounded-full transition-all">
                ✕
            </button>
        </div>

        <div id="modal-card-body" class="space-y-2 text-sm text-slate-300 border-t border-b border-slate-800 py-4 my-2">
            <!-- Contenuto dinamico della carta -->
        </div>

        <div class="mt-6 flex gap-3">
            <button onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-xl transition-all text-sm">
                Chiudi
            </button>
            <button onclick="alert('Operazione confermata dal Banco!'); closeModal();" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl transition-all text-sm">
                Acquista / Paga
            </button>
        </div>
    </div>
</div>

<!-- JavaScript Logica NFC & JSON Parsing -->
<script>
    const propertiesDB = [
        { name: "Rione 167", type: "property", price: 60, houseCost: 50, base: 2, c1: 10, c2: 30, c3: 90, c4: 160, hotel: 250, mortgage: 30 },
        { name: "Capolinea Bus EAV", type: "station", price: 200, base: 25, mortgage: 100 }
    ];

    function logAction(msg) {
        const logBox = document.getElementById('log-box');
        const time = new Date().toLocaleTimeString();
        logBox.innerHTML += `<div>[${time}] ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function startNFCReader() {
        const statusEl = document.getElementById('nfc-status');
        
        if (!('NDEFReader' in window)) {
            statusEl.innerHTML = '<span class="text-red-400">❌ Web NFC non supportato su questo browser (usa Chrome su Android).</span>';
            logAction('Errore: Web NFC non supportato.');
            return;
        }

        try {
            statusEl.innerHTML = '<span class="text-amber-400 animate-pulse">📡 Lettura NFC attiva... Avvicina la carta contratto.</span>';
            logAction('Scanner NFC avviato in attesa di tag...');

            const ndef = new NDEFReader();
            await ndef.scan();

            ndef.addEventListener("reading", ({ message, serialNumber }) => {
                logAction(`Tag NFC rilevato! (UID: ${serialNumber || 'N/D'})`);
                
                for (const record of message.records) {
                    if (record.recordType === "text") {
                        const textDecoder = new TextDecoder(record.encoding || 'utf-8');
                        const scannedText = textDecoder.decode(record.data);
                        parseNFCData(scannedText);
                        break;
                    }
                }
            });
        } catch (error) {
            statusEl.innerHTML = `<span class="text-red-400">Errore NFC: ${error.message}</span>`;
            logAction(`Errore NFC: ${error.message}`);
        }
    }

    function parseNFCData(scannedData) {
        let cardInfo = null;

        try {
            // Tenta di interpretare il payload come JSON strutturato
            cardInfo = JSON.parse(scannedData);
            logAction(`Dati JSON decodificati con successo per: ${cardInfo.name}`);
        } catch (e) {
            // Fallback: se è testo semplice, cerca nel database integrato
            logAction(`Testo semplice rilevato: "${scannedData}". Ricerca nel DB...`);
            cardInfo = propertiesDB.find(p => p.name.toLowerCase() === scannedData.toLowerCase().trim());
        }

        if (cardInfo) {
            displayFullCardDetails(cardInfo);
            document.getElementById('nfc-status').innerHTML = `<span class="text-green-400">✅ Letta con successo: ${cardInfo.name}</span>`;
        } else {
            showGenericCardModal(scannedData);
            document.getElementById('nfc-status').innerHTML = `<span class="text-amber-400">⚠️ Letto testo non censito: ${scannedData}</span>`;
        }
    }

    function displayFullCardDetails(card) {
        const modal = document.getElementById('qr-modal');
        const titleEl = document.getElementById('modal-card-title');
        const badgeEl = document.getElementById('modal-card-badge');
        const bodyEl = document.getElementById('modal-card-body');

        titleEl.innerText = card.name;
        
        let isStation = card.type === 'station';
        badgeEl.innerText = isStation ? '🚌 Stazione / Bus' : '🏠 Terreno / Proprietà';

        let bodyContent = `
            <div class="flex justify-between"><span>Prezzo d'Acquisto:</span> <strong class="text-amber-400">€A ${card.price}</strong></div>
        `;

        if (!isStation) {
            bodyContent += `
                <div class="flex justify-between"><span>Costo Casa/Albergo:</span> <strong>€A ${card.houseCost}</strong></div>
                <div class="flex justify-between"><span>Affitto Base:</span> <strong>€A ${card.base}</strong></div>
                <div class="flex justify-between"><span>Con 1 Casa:</span> <strong>€A ${card.c1}</strong></div>
                <div class="flex justify-between"><span>Con 2 Case:</span> <strong>€A ${card.c2}</strong></div>
                <div class="flex justify-between"><span>Con 3 Case:</span> <strong>€A ${card.c3}</strong></div>
                <div class="flex justify-between"><span>Con 4 Case:</span> <strong>€A ${card.c4}</strong></div>
                <div class="flex justify-between"><span>Con Albergo:</span> <strong>€A ${card.hotel}</strong></div>
            `;
        } else {
            bodyContent += `
                <div class="flex justify-between"><span>Affitto 1 Stazione:</span> <strong>€A ${card.base}</strong></div>
                <div class="flex justify-between"><span>Affitto 2 Stazioni:</span> <strong>€A ${card.base * 2}</strong></div>
            `;
        }

        bodyContent += `<div class="flex justify-between border-t border-slate-800 pt-2 mt-2"><span>Valore Ipoteca:</span> <strong class="text-red-400">€A ${card.mortgage}</strong></div>`;

        bodyEl.innerHTML = bodyContent;
        modal.style.display = 'flex';
    }

    function showGenericCardModal(text) {
        const modal = document.getElementById('qr-modal');
        document.getElementById('modal-card-title').innerText = text;
        document.getElementById('modal-card-badge').innerText = 'Tag Generico';
        document.getElementById('modal-card-body').innerHTML = `<p class="py-4 text-center text-slate-400">Contenuto letto dal tag NFC:<br><code class="text-white font-mono">${text}</code></p>`;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('qr-modal').style.display = 'none';
    }

    function simulateDemoCard() {
        // Simulazione di una lettura JSON di un contratto reale
        const sampleJson = JSON.stringify({
            name: "Rione 167",
            type: "property",
            price: 60,
            houseCost: 50,
            base: 2,
            c1: 10,
            c2: 30,
            c3: 90,
            c4: 160,
            hotel: 250,
            mortgage: 30
        });
        logAction('Simulata lettura tag JSON (Demo)');
        parseNFCData(sampleJson);
    }
</script>
